<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Não Vote Em Flávio Bolsonaro</title>
<style>
:root{--bg:#fafaf7;--card:#fff;--text:#1a1a1a;--muted:#5f5f5a;--accent:#e4572e;--line:#e5e3dc;--ph:#ecebe4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121211;--card:#1c1c1a;--text:#f2f1ec;--muted:#a3a29b;--accent:#ff7a52;--line:#2c2c29;--ph:#262624}}
:root[data-theme="dark"]{--bg:#121211;--card:#1c1c1a;--text:#f2f1ec;--muted:#a3a29b;--accent:#ff7a52;--line:#2c2c29;--ph:#262624}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
header{text-align:center;padding:72px 20px 40px;max-width:1100px;margin:0 auto}
h1{font-size:clamp(2.6rem,9vw,6.5rem);line-height:1;margin:0;font-weight:900;letter-spacing:-.03em;text-transform:uppercase}
h1 span{color:var(--accent)}
section{max-width:1100px;margin:0 auto;padding:0 20px 48px}
h3{font-size:1.6rem;margin:0 0 20px;padding-bottom:10px;border-bottom:2px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
article{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.frame{background:var(--ph);display:flex;justify-content:center}
.frame iframe{border:0;width:100%;max-width:325px;height:740px}
.info{padding:16px 18px 20px}
.num{font-size:.75rem;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase}
h2{font-size:1.1rem;margin:4px 0 6px}
.info p{margin:0 0 10px;color:var(--muted);font-size:.95rem}
.btn{display:inline-block;font-size:.9rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:6px 14px}
.btn:hover{background:var(--accent);color:var(--bg)}
.news .info{padding:22px 20px}
footer{text-align:center;color:var(--muted);padding:0 20px 40px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Não Vote no<span> Flávio Bolsonaro</span></h1>
</header>

<section>
  <h3>Vídeos</h3>
  <div class="grid" id="videos"></div>
</section>

<section>
  <h3>Notícias</h3>
  <div class="grid news" id="news"></div>
</section>

<footer>© <span id="y"></span></footer>

<script>
// Edite as legendas aqui. Cada vídeo: usuário, id do TikTok e legenda.
const videos=[
 {u:"bcppolitica",id:"7696144777208958226",legenda:"Piada Homofóbica"},
 {u:"acabraquefala4",id:"7695922011901660436",legenda:"Pense bem antes de votar"},
 {u:"ponto.de.vista.pr",id:"7678688379575291157",legenda:"Assassinos votam em Flávio?"},
 {u:"_renaults",id:"7695241774532398343",legenda:"Bolsa Família"},
 {u:"tainasilvadaily",id:"7696496140182670612",legenda:"Programas Sociais"},
 {u:"verdadespoliticas_",id:"7694441689460559105",legenda:"Flávio Odeia a Educação"},
 {u:"viralz131313",id:"7693709706648374549",legenda:"Apito de Cachorro"},
 {u:"folhory",id:"7692258008964893953",legenda:"Você Votaria Nele?"}
];
const news=[
 {fonte:"Sul21",url:"https://sul21.com.br/noticias/politica/2026/10/intercept-flavio-bolsonaro-pagou-r-600-mil-a-empresa-de-manipulacao-eleitoral-dos-eua/",legenda:"Segundo reportagem do Intercept, repercutida pelo Sul21, Flávio Bolsonaro teria pago R$ 600 mil a uma empresa americana de manipulação eleitoral."},
 {fonte:"Brasil de Fato",url:"https://www.brasildefato.com.br/2026/10/16/e-flavio-bolsonaro-defendeu-pm-que-atirou-em-crianca-votou-por-armas-a-agressores-de-mulheres-e-condecorou-milicianos-relembre-historico",legenda:"O Brasil de Fato relembra o histórico de Flávio Bolsonaro em temas como segurança pública, armas, violência contra a mulher e milicianos."},
 {fonte:"UOL",url:"https://noticias.uol.com.br/eleicoes/2026/10/16/a-9-dias-da-eleicao-pf-pede-mais-prazo-para-investigar-flavio-bolsonaro.htm",legenda:"A 9 dias da eleição, a Polícia Federal pede mais prazo para concluir a investigação envolvendo Flávio Bolsonaro, segundo o UOL."},
 {fonte:"UOL",url:"https://noticias.uol.com.br/eleicoes/2026/10/16/ataques-a-lula-critica-a-globo-contra-reeleicao-o-que-flavio-disse-no-jn.htm",legenda:"O UOL resume o que Flávio Bolsonaro disse no Jornal Nacional: ataques a Lula, críticas à Globo e posição contra a reeleição."}
];
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e}
const vg=document.getElementById("videos");
videos.forEach((v,i)=>{
  const a=el("article"),f=el("div","frame"),ifr=document.createElement("iframe");
  ifr.src="https://www.tiktok.com/embed/v2/"+v.id;ifr.loading="lazy";ifr.title="Vídeo "+(i+1);
  ifr.allow="fullscreen;encrypted-media";ifr.allowFullscreen=true;f.appendChild(ifr);
  const info=el("div","info");
  const link=el("a","btn","Assistir no TikTok");link.href="https://www.tiktok.com/@"+v.u+"/video/"+v.id;link.target="_blank";link.rel="noopener";
  info.append(el("div","num","Vídeo "+String(i+1).padStart(2,"0")),el("h2","","@"+v.u),el("p","",v.legenda),link);
  a.append(f,info);vg.appendChild(a);
});
const ng=document.getElementById("news");
news.forEach((n,i)=>{
  const a=el("article"),info=el("div","info");
  const link=el("a","btn","Ler matéria");link.href=n.url;link.target="_blank";link.rel="noopener";
  info.append(el("div","num",n.fonte),el("h2","","Notícia "+(i+1)),el("p","",n.legenda),link);
  a.appendChild(info);ng.appendChild(a);
});
document.getElementById("y").textContent=new Date().getFullYear();
</script>
</body>
</html>
